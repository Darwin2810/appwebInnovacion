name: EXLAIDER validation
on:
  push:
    branches: [exlaider-qr-firebase]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint -- --max-warnings=0 && npm test
      - run: npm run test:cloud
      - run: npm run build
      - run: npm run build -- --mode emulator
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-reports
          path: .verification/*report.json
          if-no-files-found: ignore
