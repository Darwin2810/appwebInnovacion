name: EXLAIDER validation
on:
  push:
    branches: [exlaider-qr-firebase, exlaider-erp]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run lint -- --max-warnings=0 && npm test
      - run: node scripts/ci-check.mjs test:cloud
      - run: npm run build
        if: ${{ !cancelled() }}
      - run: node scripts/ci-check.mjs test:setup
        if: ${{ !cancelled() }}
      - run: npm run build -- --mode emulator
        if: ${{ !cancelled() }}
      - run: node scripts/ci-check.mjs test:browser
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-reports
          path: |
            .verification/*report.json
            .verification/*.png
          if-no-files-found: ignore
